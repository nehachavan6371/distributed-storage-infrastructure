version: "3.9"

services:

  coordinator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coordinator
    ports:
      - "8000:8000"
    environment:
      - NODE_1_URL=http://storage-node-1:8001
      - NODE_2_URL=http://storage-node-2:8002
      - NODE_3_URL=http://storage-node-3:8003
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=storage_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    depends_on:
      - postgres
      - storage-node-1
      - storage-node-2
      - storage-node-3
    networks:
      - storage-net

  storage-node-1:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: storage-node-1
    ports:
      - "8001:8001"
    environment:
      - NODE_ID=node-1
      - NODE_PORT=8001
    networks:
      - storage-net

  storage-node-2:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: storage-node-2
    ports:
      - "8002:8002"
    environment:
      - NODE_ID=node-2
      - NODE_PORT=8002
    networks:
      - storage-net

  storage-node-3:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: storage-node-3
    ports:
      - "8003:8003"
    environment:
      - NODE_ID=node-3
      - NODE_PORT=8003
    networks:
      - storage-net

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      - POSTGRES_DB=storage_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - storage-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml
    networks:
      - storage-net

volumes:
  pg_data:

networks:
  storage-net:
    driver: bridge
