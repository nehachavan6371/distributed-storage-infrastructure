groups:
  - name: storage_alerts
    rules:

      - alert: StorageNodeDown
        expr: up{job=~"storage-node.*"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Storage node {{ $labels.job }} is DOWN"
          description: "Node has been unreachable for more than 30 seconds."

      - alert: HighErrorRate
        expr: rate(storage_errors_total[5m]) > 0.01
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on {{ $labels.node_id }}"
          description: "Error rate exceeds 1% threshold."

      - alert: HighWriteLatency
        expr: histogram_quantile(0.95, rate(storage_write_latency_seconds_bucket[5m])) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High write latency on {{ $labels.node_id }}"
          description: "95th percentile write latency exceeds 500ms."

      - alert: LowHealthyNodes
        expr: count(up{job=~"storage-node.*"} == 1) < 2
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Less than 2 healthy storage nodes"
          description: "Replication integrity is at risk."
