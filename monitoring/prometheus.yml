global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "coordinator"
    static_configs:
      - targets: ["coordinator:8000"]

  - job_name: "storage-node-1"
    static_configs:
      - targets: ["storage-node-1:8001"]
    metrics_path: "/node/metrics"

  - job_name: "storage-node-2"
    static_configs:
      - targets: ["storage-node-2:8002"]
    metrics_path: "/node/metrics"

  - job_name: "storage-node-3"
    static_configs:
      - targets: ["storage-node-3:8003"]
    metrics_path: "/node/metrics"
