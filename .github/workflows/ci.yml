name: CI/CD Pipeline — Distributed Storage Infrastructure

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit and integration tests
        run: |
          pytest tests/ -v --tb=short

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build coordinator image
        run: docker build -t distributed-storage-coordinator:latest -f Dockerfile .

      - name: Build storage node image
        run: docker build -t distributed-storage-node:latest -f Dockerfile.node .

      - name: Verify images built
        run: docker images | grep distributed-storage

  integration:
    name: Integration Test with Docker Compose
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: cp .env.example .env

      - name: Start all services
        run: docker-compose up -d --build

      - name: Wait for services to be ready
        run: sleep 15

      - name: Health check — all nodes
        run: |
          curl -f http://localhost:8001/node/health
          curl -f http://localhost:8002/node/health
          curl -f http://localhost:8003/node/health
          curl -f http://localhost:8000/nodes/status

      - name: Test write and read via API
        run: |
          curl -f -X POST http://localhost:8000/storage/write \
            -H "Content-Type: application/json" \
            -d '{"block_id":"ci_test_block","data":"hello from CI pipeline","replication_factor":3}'

      - name: Tear down
        run: docker-compose down
